services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: buildfolio-postgres

    environment:
      POSTGRES_DB: buildfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - buildfolio_pg_data:/var/lib/postgresql/data
      - ./docker-postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  buildfolio_pg_data: