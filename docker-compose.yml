services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: buildfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildfolio}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - buildfolio_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-buildfolio}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - buildfolio-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: buildfolio-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-buildfolio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TOKEN_ENCRYPTOR_PASSWORD: ${TOKEN_ENCRYPTOR_PASSWORD:-buildfolioSecretPass123}
      TOKEN_ENCRYPTOR_SALT: ${TOKEN_ENCRYPTOR_SALT:-7a9e3b4c1d2e5f80}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Spring AI Ollama configuration
      SPRING_AI_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: ${OLLAMA_MODEL:-llama3}
      SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
    networks:
      - buildfolio-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: buildfolio-client
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    networks:
      - buildfolio-net

  ollama:
    image: ollama/ollama:latest
    container_name: buildfolio-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - buildfolio-net

networks:
  buildfolio-net:
    driver: bridge

volumes:
  buildfolio_pg_data:
  ollama_data:
