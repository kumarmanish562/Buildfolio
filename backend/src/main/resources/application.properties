spring.application.name=buildfolio-backend

server.port=8080


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5433/buildfolio
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Explicit PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=http://localhost:3000


# =========================================================
# FRONTEND
# =========================================================

app.frontend-url=http://localhost:3000


# =========================================================
# ENCRYPTION
# =========================================================

app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}





# =========================================================
# INDEXING
# =========================================================

app.indexing.chunk-size=800
app.indexing.max-file-bytes=102400


# =========================================================
# SPRING AI / PGVECTOR
# =========================================================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.max-document-batch-size=32


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,loggers,flyway

management.endpoint.health.show-details=when_authorized

management.info.env.enabled=true

info.app.name=BuildFolio
info.app.description=AI-powered GitHub code assistant
info.app.version=1.0.0

# =========================================================
# GITHUB
# =========================================================

app.github.api-delay-ms=100

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo